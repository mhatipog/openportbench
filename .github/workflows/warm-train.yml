name: PSP warm-start training experiment
on:
  push:
    branches: [main]
    paths:
      - scripts/warm_train.py
      - .github/workflows/warm-train.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: benchmark
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: PJ-NTU/LACE
          ref: d772b74690075f641be8077e69748ec482e9febf
          path: lace_source
          persist-credentials: false
          sparse-checkout: |
            lace
            problems/port_scheduling_problem
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install free solver and LACE dependencies
        working-directory: benchmark
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy scipy mip networkx
      - name: Paired CP-SAT cold versus feasible incumbent hint
        working-directory: benchmark
        env:
          LACE_ROOT: ../lace_source
          PYTHONUNBUFFERED: '1'
        run: python scripts/warm_train.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: warm-train-records
          path: benchmark/results/tmp/psp-warm-hint-train.json
          retention-days: 30
