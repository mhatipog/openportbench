name: Archive frozen three-solver heldout tournament
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-solver-matrix-heldout.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download exact successful heldout benchmark artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/raw /tmp/matrix-heldout
          gh run download 40565061452 --repo "$GITHUB_REPOSITORY" -n strict-solver-matrix-heldout -D /tmp/matrix-heldout
          cp /tmp/matrix-heldout/solver-matrix-heldout.json results/raw/2026-10-27-solver-matrix-heldout.json
      - name: Verify original raw digest and independent objective statuses
        run: |
          echo "eb5d9ddfdc975fcc370d632a307cf0c0b5f80b45a8afc9a7ff8371b031c9e559  results/raw/2026-10-27-solver-matrix-heldout.json" | sha256sum -c -
          python - <<'PY'
          import json
          p="results/raw/2026-10-27-solver-matrix-heldout.json"
          d=json.load(open(p))
          assert d['benchmark_commit']=='1bef1d38a86373d07c50a19bdc4946269934aa00'
          assert d['source_sha']=='d772b74690075f641be8077e69748ec482e9febf'
          assert d['split']=='test' and len(d['rows'])==12
          assert d['refinement_hard_wall_s']==5
          assert {r['n'] for r in d['rows']}=={80,100,150}
          assert all(r['source_status']=='FEASIBLE' for r in d['rows'])
          assert all(v['upstream_verified'] and v['valid'] for r in d['rows'] for v in r['methods'].values())
          assert sum(r['methods']['warm-cp-sat']['status']=='TIMEOUT' for r in d['rows'])==8
          assert sum(r['methods']['fix-optimize-cp-sat']['status']=='FEASIBLE' for r in d['rows'])==12
          assert sum(r['methods']['restricted-highs-milp']['solver_status']=='MASTER_OPTIMAL' for r in d['rows'])==12
          print('VERIFIED: 12 fully checked frozen 80-150 vessel comparisons')
          PY
      - name: Generate human-readable source-linked scorecard
        run: |
          python -m pip install -e .
          python scripts/render_solver_matrix.py results/raw/2026-10-27-solver-matrix-heldout.json --output results/2026-10-27-solver-matrix-heldout.md
          python scripts/render_solver_matrix.py results/raw/2026-10-27-solver-matrix-train.json --output results/2026-10-27-solver-matrix-train-scorecard.md
      - name: Commit primary evidence and independently derived scorecards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/raw results/*.md
          if ! git diff --cached --quiet; then
            git commit -m "Archive independent solver-family heldout evidence and scorecards"
            git push origin HEAD:main
          fi
