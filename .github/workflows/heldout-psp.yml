name: PSP held-out independent verification
on:
  push:
    branches: [main]
    paths:
      - scripts/heldout_psp.py
      - .github/workflows/heldout-psp.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heldout-psp
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: benchmark
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: PJ-NTU/LACE
          ref: d772b74690075f641be8077e69748ec482e9febf
          path: lace_source
          persist-credentials: false
          sparse-checkout: |
            lace
            problems/port_scheduling_problem
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install free solvers and upstream dependencies
        working-directory: benchmark
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy scipy mip networkx
      - name: Frozen methods, original LACE held-out test inputs
        working-directory: benchmark
        env:
          LACE_ROOT: ../lace_source
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/heldout_psp.py --split test --per-group 1 \
            --seconds 0.15 --seeds 1 --cp-max-vessels 80 \
            --output results/tmp/heldout-psp.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: psp-heldout-raw
          path: benchmark/results/tmp/heldout-psp.jsonl
          if-no-files-found: warn
          retention-days: 30
