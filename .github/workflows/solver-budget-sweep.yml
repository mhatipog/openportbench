name: Benchmark scaling - shared-incumbent hard wall budget sweep
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/solver-budget-sweep.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solver-budget-sweep
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: benchmark
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: PJ-NTU/LACE
          ref: d772b74690075f641be8077e69748ec482e9febf
          path: lace_source
          persist-credentials: false
          sparse-checkout: |
            lace
            problems/port_scheduling_problem
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install and report solver dependencies
        working-directory: benchmark
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install mip networkx
          python -m pip freeze > results-dependencies.txt
      - name: Check PSP model and adapter unit tests before research compute
        working-directory: benchmark
        run: pytest -q
      - name: Freeze common baseline then compare four methods at both deadlines
        working-directory: benchmark
        env:
          LACE_ROOT: ../lace_source
          PYTHONUNBUFFERED: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python scripts/solver_matrix.py --split test --sizes 80,100,150,250,300,500 --indices 012 --seeds 1,2 --source-seconds 2 --refine-budgets 3,10 --methods warm-cp-sat,fix-optimize-cp-sat,restricted-highs-milp,adaptive-ruin-recreate --output results/tmp/solver-budget-sweep.json
      - name: Create deterministic comparative Markdown report
        if: success()
        working-directory: benchmark
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from openportbench.matrix_profile import render_sweep, summarize_sweep
          p=Path("results/tmp/solver-budget-sweep.json")
          payload=p.read_bytes()
          doc=json.loads(payload)
          assert doc["protocol"] == "PSP-strict-common-incumbent-sweep-v1"
          assert len(doc["rows"]) == 12
          assert set(doc["methods"]) == {
              "warm-cp-sat","fix-optimize-cp-sat",
              "restricted-highs-milp","adaptive-ruin-recreate"
          }
          assert all(len(row["methods_by_budget"])==2 for row in doc["rows"])
          assert doc["summary_by_budget"]==summarize_sweep(doc)
          report=render_sweep(doc,hashlib.sha256(payload).hexdigest())
          Path("results/tmp/solver-budget-sweep.md").write_text(report)
          print(report)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: four-method-frozen-multi-budget-sweep
          path: |
            benchmark/results/tmp/solver-budget-sweep.json
            benchmark/results/tmp/solver-budget-sweep.md
            benchmark/results-dependencies.txt
          retention-days: 30
          if-no-files-found: warn
