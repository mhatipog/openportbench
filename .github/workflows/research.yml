name: LACE reference smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/reproduce_lace.py'
      - '.github/workflows/research.yml'

permissions:
  contents: read

concurrency:
  group: lace-smoke
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: benchmark
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: PJ-NTU/LACE
          ref: d772b74690075f641be8077e69748ec482e9febf
          path: lace_source
          persist-credentials: false
          sparse-checkout: |
            lace
            problems/port_scheduling_problem
            problems/multi_tugboat_routing_and_scheduling_problem
            problems/multi_base_tugboat_routing_and_scheduling_problem
            problems/multi_tugboat_routing_problem_with_variable_speed
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install free optimizers and LACE runtime dependencies
        working-directory: benchmark
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy scipy mip networkx
      - name: Validate and reproduce pinned train samples
        working-directory: benchmark
        env:
          LACE_ROOT: ../lace_source
          PYTHONUNBUFFERED: '1'
        run: python scripts/reproduce_lace.py --seconds-per-heuristic 0.35 --seed 1 --output results/smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lace-smoke-report
          path: benchmark/results/smoke.json
          if-no-files-found: warn
          retention-days: 14
