name: Solver tournament - four independent search strategies
on:
  push:
    branches: [main]
    paths:
      - scripts/solver_matrix.py
      - .github/workflows/solver-matrix-four.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solver-matrix-four
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: benchmark
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: PJ-NTU/LACE
          ref: d772b74690075f641be8077e69748ec482e9febf
          path: lace_source
          persist-credentials: false
          sparse-checkout: |
            lace
            problems/port_scheduling_problem
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned public solver families
        working-directory: benchmark
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install mip networkx
      - name: Run four fixed search strategies under identical hard wall limits
        working-directory: benchmark
        env:
          LACE_ROOT: ../lace_source
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/solver_matrix.py --split train --sizes 20,40,60 --indices 006,007 --seeds 1,2 --source-seconds 0.8 --refine-seconds 3 --methods warm-cp-sat,fix-optimize-cp-sat,restricted-highs-milp,adaptive-ruin-recreate --output results/tmp/four-strategies-train.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: strict-four-strategies-train
          path: benchmark/results/tmp/four-strategies-train.json
          retention-days: 30
          if-no-files-found: warn
