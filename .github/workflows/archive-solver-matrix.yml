name: Archive reproducible strict solver tournament
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-solver-matrix.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download immutable original benchmark artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/raw /tmp/matrix
          gh run download 40564515672 --repo "$GITHUB_REPOSITORY" -n strict-solver-matrix-train -D /tmp/matrix
          cp /tmp/matrix/solver-matrix.json results/raw/2026-10-27-solver-matrix-train.json
      - name: Check SHA256, split, input records, method validity and proof labels
        run: |
          echo "fd01ee862532e22f88d256c7ca66a2ffad9f171c46c647595358ade912436b34  results/raw/2026-10-27-solver-matrix-train.json" | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('results/raw/2026-10-27-solver-matrix-train.json'))
          assert r['protocol']=='PSP-strict-common-incumbent-v1'
          assert r['benchmark_commit']=='4e801fc00402a61be20e57c119ebeddc1319ce81'
          assert r['source_sha']=='d772b74690075f641be8077e69748ec482e9febf'
          assert r['split']=='train' and len(r['rows'])==12
          assert {x['n'] for x in r['rows']}=={20,40,60}
          assert all(len(x['methods'])==3 and x['source_status']=='FEASIBLE' for x in r['rows'])
          assert all(m['upstream_verified'] and m['valid']
                     for x in r['rows'] for m in x['methods'].values())
          assert sum(x['methods']['warm-cp-sat']['status']=='TIMEOUT'
                     for x in r['rows'])==10
          assert sum(x['methods']['restricted-highs-milp']['solver_status']=='MASTER_OPTIMAL'
                     for x in r['rows'])==12
          print('VERIFIED: 12 strictly budgeted paired, independently checked trials')
          PY
      - name: Record exact primary-source JSON in Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/raw
          if ! git diff --cached --quiet; then
            git commit -m "Archive strict-wall CP-SAT versus HiGHS/MILP benchmark evidence"
            git push origin HEAD:main
          fi
