name: Metric location and dispatch experiments
on:
  push:
    branches: [main]
    paths:
      - src/openportbench/mobile.py
      - tests/test_mobile.py
      - scripts/metric_experiments.py
      - .github/workflows/metric-experiments.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metric-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_mobile.py
      - run: python scripts/metric_experiments.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: synthetic-metric-experiment
          path: results/tmp/metric-mobility.json
          retention-days: 30
