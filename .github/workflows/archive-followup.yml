name: Archive verified hybrid and timeout evidence
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-followup.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download pinned successful experiment artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/raw /tmp/holdout002 /tmp/holdout003 /tmp/hard
          gh run download 40552310581 --repo "$GITHUB_REPOSITORY" -n warm-heldout-records -D /tmp/holdout002
          gh run download 40553292608 --repo "$GITHUB_REPOSITORY" -n warm-heldout-003-records -D /tmp/holdout003
          gh run download 40553225194 --repo "$GITHUB_REPOSITORY" -n psp-strict-wall-evidence -D /tmp/hard
          cp /tmp/holdout002/psp-warm-hint-heldout.json results/raw/2026-10-27-warm-heldout-002.json
          cp /tmp/holdout003/psp-warm-hint-heldout-003.json results/raw/2026-10-27-warm-heldout-003.json
          cp /tmp/hard/psp-hard-timeout-audit.json results/raw/2026-10-27-strict-wall.json
      - name: Verify exact artifact digests and record counts
        run: |
          echo "03b4a7b1c784ee14ada17453c71f0748e2e06d9f587f9dae6039bf96de789f85  results/raw/2026-10-27-warm-heldout-002.json" | sha256sum -c -
          echo "04fcc7d8806fe7dae75db3e1fefce71bd64f0dc496241210002f77d6fadbb620  results/raw/2026-10-27-warm-heldout-003.json" | sha256sum -c -
          echo "d90bbdee0cdeb6d5cf5b09c54a3e4f9262188109a9506401a44603d8f4cdde3a  results/raw/2026-10-27-strict-wall.json" | sha256sum -c -
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("results/raw")
          a=json.loads((p/"2026-10-27-warm-heldout-002.json").read_text())
          b=json.loads((p/"2026-10-27-warm-heldout-003.json").read_text())
          c=json.loads((p/"2026-10-27-strict-wall.json").read_text())
          assert len(a["rows"])==len(b["rows"])==6
          assert a["benchmark_sha"]=="0b617accdd2492679bbe0b097243187db9f00d10"
          assert b["benchmark_sha"]=="fbef05029b3acacf16a584efcc791ae00f22948d"
          assert len(c["cases"])==3 and all(len(x["methods"])==10 for x in c["cases"])
          print("VERIFIED: 12 heldout comparisons, 30 corrected hard-time audit rows")
          PY
      - name: Commit provenance-preserving raw records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/raw
          if ! git diff --cached --quiet; then
            git commit -m "Archive checksummed hybrid and strict-wall audit records"
            git push origin HEAD:main
          fi
