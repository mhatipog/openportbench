[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openportbench"
version = "0.1.0"
description = "Reproducible, independently checked maritime planning optimization benchmarks"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "OpenPortBench contributors"}]
dependencies = []

[project.optional-dependencies]
solver = ["ortools>=9.11,<11", "scipy>=1.14,<2", "numpy>=1.26"]
dev = ["pytest>=8", "ortools>=9.11,<11", "scipy>=1.14,<2", "numpy>=1.26"]

[project.scripts]
openportbench = "openportbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
